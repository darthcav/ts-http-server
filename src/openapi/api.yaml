openapi: 3.1.0

##### Info
info:
  title: Basic API
  description: |
    Reference implementation of the HTTP server.
  version: 0.6.0

##### Servers
servers:
  - url: http://localhost:8888/
    description: Local server

##### Tags
tags:
  - name: index
    description: Operations related to the root of the API
  - name: health
    description: Operations related to service health and status

##### Paths
paths:
  /health:
    summary: Health and status routes
    get:
      operationId: getHealth
      summary: Returns the service health and environment status
      tags:
        - health
      responses:
        200:
          description: Health report (overall status `pass` or `warn`)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        503:
          description: Health report when one or more checks fail (status `fail`)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
    head:
      operationId: headHealth
      summary: Returns headers for the health endpoint
      tags:
        - health
      responses:
        200:
          description: Empty response with headers
    delete:
      operationId: deleteHealth
      summary: Not allowed on the health endpoint
      tags:
        - health
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    patch:
      operationId: patchHealth
      summary: Not allowed on the health endpoint
      tags:
        - health
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    post:
      operationId: postHealth
      summary: Not allowed on the health endpoint
      tags:
        - health
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    put:
      operationId: putHealth
      summary: Not allowed on the health endpoint
      tags:
        - health
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
  /api/:
    summary: API index routes
    get:
      operationId: getApiIndex
      summary: Returns a welcome message
      tags:
        - index
      responses:
        200:
          description: Welcome message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeMessage"
    head:
      operationId: headApiIndex
      summary: Returns headers for the API index
      tags:
        - index
      responses:
        200:
          description: Empty response with headers
    delete:
      operationId: deleteApiIndex
      summary: Not allowed on the API index
      tags:
        - index
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    patch:
      operationId: patchApiIndex
      summary: Not allowed on the API index
      tags:
        - index
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    post:
      operationId: postApiIndex
      summary: Not allowed on the API index
      tags:
        - index
      responses:
        405:
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                405:
                  $ref: "#/components/examples/http_405"
    put:
      operationId: putApiIndex
      summary: Not allowed on the API index
      tags:
        - index
      responses:
        405:
          description: Method not allowed
